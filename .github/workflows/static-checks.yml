name: Frontend Static Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check frontend contract
        run: python scripts/check_frontend_contract.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check api-config.js
          node --check app.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Run credential-free regression and showcase tests
        run: node --test tests/*.test.js

      - name: Run credential-free local SAP proxy tests
        run: python -B -m unittest discover -s tests -p test_sap_proxy.py

      - name: Syntax-parse Python without executing validators
        run: |
          python -c "import ast; from pathlib import Path; [ast.parse(Path(p).read_text(encoding='utf-8'), filename=p) for p in ('scripts/sap_live_validate.py', 'scripts/check_frontend_contract.py', 'scripts/serve.py', 'tests/test_sap_proxy.py')]"
